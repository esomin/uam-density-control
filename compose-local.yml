version: '3.8'

services:
  # L2: MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: uam-mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # L3: In-Memory DB (Priority Queue)
  redis:
    image: redis:7-alpine
    container_name: uam-redis
    ports:
      - "6379:6379"

  # L5: Time-series DB (Persistence & Telemetry Logs)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: uam-timescaledb
    environment:
      POSTGRES_USER: uam_admin
      POSTGRES_PASSWORD: uam_password
      POSTGRES_DB: uam_telemetry
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./init-timescaledb.sql:/docker-entrypoint-initdb.d/init-timescaledb.sql
    restart: unless-stopped

volumes:
  timescaledb_data:
